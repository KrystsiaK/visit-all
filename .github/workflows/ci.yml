name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  CI_HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
  CI_HAS_AUTH_SECRET: ${{ secrets.AUTH_SECRET != '' }}
  CI_HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_database_url: ${{ steps.flags.outputs.has_database_url }}
      has_auth_secret: ${{ steps.flags.outputs.has_auth_secret }}
      has_sonar_token: ${{ steps.flags.outputs.has_sonar_token }}

    steps:
      - name: Compute secret availability
        id: flags
        env:
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          HAS_AUTH_SECRET: ${{ secrets.AUTH_SECRET != '' }}
          HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
        run: |
          echo "has_database_url=${HAS_DATABASE_URL}" >> "$GITHUB_OUTPUT"
          echo "has_auth_secret=${HAS_AUTH_SECRET}" >> "$GITHUB_OUTPUT"
          echo "has_sonar_token=${HAS_SONAR_TOKEN}" >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        if: ${{ env.CI_HAS_DATABASE_URL == 'true' }}
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run quality gates
        run: npm run ci:quality
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-placeholder-auth-secret' }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - preflight
      - quality
    if: ${{ needs.preflight.outputs.has_database_url == 'true' && needs.preflight.outputs.has_auth_secret == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

  sonar:
    runs-on: ubuntu-latest
    needs:
      - preflight
      - quality
    if: ${{ needs.preflight.outputs.has_sonar_token == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sonar Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
